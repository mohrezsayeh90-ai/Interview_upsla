[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "random-flow-network"
version = "1.0.0"
description = "Verified stochastic flow on a square lattice, uncertainty and grouped Sobol analysis"
requires-python = ">=3.11"
dependencies = ["numpy>=2.0", "scipy>=1.13", "pandas>=2.2", "matplotlib>=3.8"]

[project.optional-dependencies]
dev = ["pytest>=8"]
report = ["python-pptx>=1.0"]
pinn = ["torch>=2.5"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
